# Desarrollo local — secretos y puertos desde `.env` (ver `.env.example`).
#   cp .env.example .env
#   docker compose --env-file .env up -d --build
#
# Los defaults mantienen el comportamiento demo si no hay `.env` (p. ej. CI ZAP).
services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OBS-02 — trazas
  tempo:
    image: grafana/tempo:2.6.1
    container_name: inventory-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  # OBS-02 — logs
  loki:
    image: grafana/loki:3.2.1
    container_name: inventory-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  # OBS-02 — collector OTLP (API → Alloy → Tempo/Loki)
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: inventory-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_OTLP_GRPC_PORT:-4317}:4317"
      - "${ALLOY_OTLP_HTTP_PORT:-4318}:4318"
      - "${ALLOY_UI_PORT:-12345}:12345"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  # OBS-03 — Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: inventory-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: inventory-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    container_name: inventory-grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki
      - alertmanager
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: inventory-keycloak
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  api:
    build: .
    container_name: inventory-api
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-inventory}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/inventory}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-inventory-api}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-inventory}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://keycloak:8080/realms/inventory/protocol/openid-connect/certs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      OTEL_TRACES_SAMPLING: ${OTEL_TRACES_SAMPLING:-1.0}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://alloy:4318/v1/traces}
      OTEL_METRICS_EXPORT_ENABLED: ${OTEL_METRICS_EXPORT_ENABLED:-false}
      OTEL_METRICS_EXPORT_URL: ${OTEL_METRICS_EXPORT_URL:-http://alloy:4318/v1/metrics}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-inventory}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-inventory-frontend}
    container_name: inventory-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - keycloak
      - api

  jenkins:
    # CICD-02 — imagen con Docker CLI, Compose y Node 22 (ver infra/jenkins/Dockerfile)
    build:
      context: ./infra/jenkins
    image: proyectoqa-jenkins:local
    container_name: inventory-jenkins
    user: root
    ports:
      - "${JENKINS_HTTP_PORT:-8082}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Path del repo en el host → bind mounts de compose (staging) desde Jenkins
      - .:/host-repo:ro

volumes:
  postgres_data:
  jenkins_home:
  tempo_data:
  loki_data:
  alloy_data:
  alertmanager_data:
