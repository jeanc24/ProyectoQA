# CICD-02 / Jenkins Security — stack mínimo SIN bind mounts del host.
# Motivo: Jenkins corre en contenedor con docker.sock; los paths relativos
# (./infra/..., ./keycloak) se resuelven en el daemon del host y fallan.
#
# Uso (desde Jenkinsfile Security):
#   docker compose -f docker-compose.security.yml up -d --build
#   docker compose -f docker-compose.security.yml down -v
#
# Suficiente para smoke JWT/CORS + ZAP (no hace falta Alloy/Tempo/Loki).
name: proyectoqa-security

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    volumes:
      - security_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
    image: proyectoqa-keycloak:security
    container_name: inventory-keycloak
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  api:
    build: .
    image: proyectoqa-api:security
    container_name: inventory-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/inventory
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/inventory/protocol/openid-connect/certs
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      # Sin Alloy en este stack
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ""
      OTEL_METRICS_EXPORT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  security_postgres_data:
