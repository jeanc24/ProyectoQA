# CICD-01 — Pipeline DevSecOps completo (orquestador)
# Stages: build → unit/API → integration → Sonar → Docker → Security → Staging E2E → gate
name: DevSecOps Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Build + unit/API + integration + Sonar + Docker images ---
  build-and-test:
    name: Build · Unit · Integration · API · Contract · Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (sin tests)
        run: ./gradlew build -x test

      - name: Unit tests
        run: ./gradlew test

      - name: Integration tests
        run: ./gradlew integrationTest
        timeout-minutes: 20

      - name: API scenario tests
        run: ./gradlew apiTest

      - name: Contract tests
        run: ./gradlew contractTest

      - name: JaCoCo report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning::SONAR_TOKEN no configurado — se omite SonarCloud"
            exit 0
          fi
          if [ -z "${SONAR_ORGANIZATION}" ]; then
            export SONAR_ORGANIZATION=jeanc24
          fi
          ./gradlew sonar -Dsonar.qualitygate.wait=true
        timeout-minutes: 15

  docker-images:
    name: Docker build API + frontend
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Pin SHA (Sonar githubactions:S7637) — tag v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build API image
        # Pin SHA (Sonar githubactions:S7637) — tag v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          tags: proyectoqa-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./frontend
          push: false
          tags: proyectoqa-frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:8080
            VITE_KEYCLOAK_URL=http://localhost:8081
            VITE_KEYCLOAK_REALM=inventory
            VITE_KEYCLOAK_CLIENT_ID=inventory-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/dependency-check.sh

      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_AUTO_UPDATE: 'true'
        run: ./scripts/dependency-check.sh

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: docs/final/testing/dependency-check/

  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start API stack
        run: docker compose up -d --build postgres keycloak tempo loki alloy api

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "API UP"
              exit 0
            fi
            echo "waiting ($i)..."
            sleep 5
          done
          docker compose logs --tail=80 api keycloak
          exit 1

      - name: Wait for Keycloak token
        run: |
          TOKEN_URL="http://localhost:8081/realms/inventory/protocol/openid-connect/token"
          for i in $(seq 1 60); do
            BODY=$(curl -s -X POST "$TOKEN_URL" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=password" \
              -d "client_id=inventory-api" \
              -d "client_secret=inventory-api-secret" \
              -d "username=admin" \
              -d "password=admin" || true)
            if echo "$BODY" | python3 -c "import sys,json; json.load(sys.stdin)['access_token']" 2>/dev/null; then
              echo "Keycloak UP"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Security smoke (JWT / CORS)
        run: |
          chmod +x scripts/security-smoke.sh
          ./scripts/security-smoke.sh

      - name: ZAP baseline scan
        run: |
          chmod +x scripts/zap-baseline.sh
          ./scripts/zap-baseline.sh http://localhost:8080/swagger-ui.html

      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: docs/final/testing/zap/

      - name: Tear down
        if: always()
        run: docker compose down -v

  staging-deploy-e2e:
    name: Deploy staging · smoke · E2E
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare staging env
        run: cp .env.staging.example .env.staging

      - name: Start staging stack
        run: |
          docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build \
            postgres keycloak tempo loki alloy api frontend

      - name: Wait for stack
        run: |
          chmod +x scripts/wait-for-stack.sh scripts/post-deploy-smoke.sh
          API_URL=http://localhost:8088 \
          KEYCLOAK_URL=http://localhost:8181 \
          FRONTEND_URL=http://localhost:3008 \
          TIMEOUT_SEC=360 \
          ./scripts/wait-for-stack.sh

      - name: Post-deploy API smoke
        run: |
          API_URL=http://localhost:8088 \
          KEYCLOAK_URL=http://localhost:8181 \
          CORS_ORIGIN=http://localhost:3008 \
          ./scripts/post-deploy-smoke.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: E2E against staging
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3008
          API_BASE: http://localhost:8088
          KEYCLOAK_URL: http://localhost:8181
          KEYCLOAK_TOKEN_URL: http://localhost:8181/realms/inventory/protocol/openid-connect/token
        run: ./node_modules/.bin/playwright test e2e/helpers/login.spec.ts e2e/permissions.spec.ts --project=chromium

      - name: Upload post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-evidence
          path: |
            docs/final/ci/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Tear down staging
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file .env.staging down -v

  quality-gate:
    name: Quality gate (all stages)
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-images
      - dependency-check
      - zap-baseline
      - staging-deploy-e2e
    if: always()
    steps:
      - name: Fail if any required stage failed
        run: |
          echo "build-and-test=${{ needs.build-and-test.result }}"
          echo "docker-images=${{ needs.docker-images.result }}"
          echo "dependency-check=${{ needs.dependency-check.result }}"
          echo "zap-baseline=${{ needs.zap-baseline.result }}"
          echo "staging-deploy-e2e=${{ needs.staging-deploy-e2e.result }}"
          for r in \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.docker-images.result }}" \
            "${{ needs.dependency-check.result }}" \
            "${{ needs.zap-baseline.result }}" \
            "${{ needs.staging-deploy-e2e.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::Quality gate FAILED (stage result=$r)"
              exit 1
            fi
          done
          echo "Quality gate PASSED — all DevSecOps stages green"
