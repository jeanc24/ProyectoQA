# Legacy / manual — el pipeline completo está en devsecops.yml (CICD-01)
name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare .env for tests
        run: test -f .env || cp .env.example .env

      - name: Build (sin tests)
        run: ./gradlew build -x test

      - name: Unit tests
        run: ./gradlew test

      - name: Integration tests
        run: ./gradlew integrationTest
        timeout-minutes: 20

      - name: API scenario tests
        run: ./gradlew apiTest

      - name: Contract tests
        run: ./gradlew contractTest

      - name: JaCoCo report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning::SONAR_TOKEN no configurado — se omite SonarCloud. Ver docs/final/quality/SONARCLOUD.md"
            exit 0
          fi
          if [ -z "${SONAR_ORGANIZATION}" ]; then
            export SONAR_ORGANIZATION=jeanc24
          fi
          ./gradlew sonar -Dsonar.qualitygate.wait=true
        timeout-minutes: 15
