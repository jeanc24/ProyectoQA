name: CI

# Triggers: on push to develop or pull request to develop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Jobs: build and test
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Steps: checkout, setup JDK, grant execute permission, build, test, upload JaCoCo report
    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Grant execute permission for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build (without tests)
      - name: Build (sin tests)
        run: ./gradlew build -x test

      # Unit tests
      - name: Unit tests
        run: ./gradlew test

      # Integration tests
      - name: Integration tests
        run: ./gradlew integrationTest

      # Upload JaCoCo report
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/