# Tempo single-binary — OBS-02
# Recibe OTLP desde Alloy (gRPC 4317 / HTTP 4318) y expone query en :3200
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

querier:
  max_concurrent_queries: 20

query_frontend:
  search:
    max_duration: 0s

overrides:
  defaults:
    metrics_generator:
      processors: []
