# Prometheus configuration file
global:
  scrape_interval: 15s

# Scrape configs for the inventory-api job
scrape_configs:
  - job_name: inventory-api # Job name to scrape metrics from the inventory-api service
    metrics_path: /actuator/prometheus # Path to scrape metrics from the inventory-api service
    static_configs:
      - targets: ['api:8080'] # Target to scrape metrics from the inventory-api service