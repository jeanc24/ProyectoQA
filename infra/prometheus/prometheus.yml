#
# Prometheus — scrape de métricas (OBS)
#


global:
  # Cada cuánto scrapea targets y reevalúa reglas
  scrape_interval: 15s
  evaluation_interval: 15s

# Reglas de alerta (OBS-03) — ver alerts.yml
rule_files:
  - /etc/prometheus/alerts.yml

# Destino de las alertas disparadas
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Job único: métricas Micrometer/Actuator de la API
  - job_name: inventory-api
    metrics_path: /actuator/prometheus
    static_configs:
      # Hostname interno de Compose (servicio `api`, puerto del contenedor)
      - targets: ["api:8080"]
