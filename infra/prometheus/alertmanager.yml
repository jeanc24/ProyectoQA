# Alertmanager — OBS-03
# UI: http://localhost:9093
global:
  resolve_timeout: 5m

route:
  receiver: default-logger
  group_by: ["alertname", "service", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical-logger
      continue: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "service"]

receivers:
  # Sin webhook externo: las alertas se ven en la UI de Alertmanager / Grafana.
  - name: default-logger
  - name: critical-logger
