plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    // SONAR-01 — SonarCloud / SonarScanner for Gradle
    id 'org.sonarqube' version '7.3.1.8318'
    // TEST-03 — SCA (Software Composition Analysis)
    id 'org.owasp.dependencycheck' version '12.2.2'
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['icc354.pucmm.proyectoqa.application.service.*']
            excludes = ['icc354.pucmm.proyectoqa.application.service.AuditService']
            limit {
                counter = 'LINE'
                minimum = 0.60
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

group = 'icc354.pucmm'
version = '0.0.1-SNAPSHOT'
description = 'ProyectoQA - Sistema de Inventarios'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springdocVersion', '2.8.6')
    set('testcontainersVersion', '1.20.6')
}

dependencies {
    // Spring Boot starter dependencies
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // PostgreSQL driver
    runtimeOnly 'org.postgresql:postgresql'
    // Flyway for database migrations
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Flyway for database migrations
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // Hibernate Envers for audit
    implementation 'org.hibernate.orm:hibernate-envers'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Grafana and Prometheus metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // OpenTelemetry (OBS-01): traces + metrics via OTLP
    // Includes micrometer-tracing-bridge-otel, micrometer-registry-otlp and OTLP exporters
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // JDBC/JPA query spans via Micrometer Observation (2.x targets Spring Boot 4)
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
    // Springdoc for API documentation
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Testcontainers for integration testing
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    // JUnit platform launcher for test execution
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit = sin integration / api / contract (stages separados en CICD-01)
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'api', 'contract'
    }
}

tasks.register('apiTest', Test) {
    description = 'API scenario tests (MockMvc *ApiScenarioTest).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'api'
    }
    shouldRunAfter test
}

tasks.register('contractTest', Test) {
    description = 'Contract checks (OpenAPI surface vs controllers / Newman collection).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'contract'
    }
    shouldRunAfter apiTest
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (Postgres + Keycloak Testcontainers; requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    // Keycloak image pull + realm import can take several minutes on cold CI
    timeout = java.time.Duration.ofMinutes(15)
    shouldRunAfter contractTest
}

tasks.named('jacocoTestReport') {
    dependsOn test, apiTest
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec', 'apiTest.exec'))
}

// SONAR-01 — SonarCloud (coverage via JaCoCo XML)
sonar {
    properties {
        property 'sonar.projectKey', 'jeanc24_ProyectoQA'
        property 'sonar.organization', System.getenv('SONAR_ORGANIZATION') ?: 'jeanc24'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.projectName', 'ProyectoQA'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.java.coveragePlugin', 'jacoco'
        property 'sonar.exclusions',
                '**/dto/**,**/generated/**,**/*Application.java'
        property 'sonar.coverage.exclusions',
                '**/dto/**,**/config/**,**/*Application.java'
    }
}

tasks.named('sonar') {
    dependsOn jacocoTestReport
}

// TEST-03 — OWASP Dependency-Check (reportes en docs/final/testing/dependency-check/)
// Sync NVD completa: DEPENDENCY_CHECK_AUTO_UPDATE=true (≥10 GB libres / CI).
// Local por defecto: autoUpdate=false (rápido; requiere DB NVD previa o solo CI).
dependencyCheck {
    formats = ['HTML', 'JSON']
    outputDirectory = "$rootDir/docs/final/testing/dependency-check"
    failBuildOnCVSS = 11
    failOnError = false
    // Solo sync completa si se pide explícitamente (evita 40–90 min locales por accidente)
    autoUpdate = System.getenv('DEPENDENCY_CHECK_AUTO_UPDATE') == 'true'
    analyzers {
        assemblyEnabled = false
        nodeAuditEnabled = false
        nodeEnabled = false
        ossIndexEnabled = true
    }
    def nvdKey = System.getenv('NVD_API_KEY')
    if (nvdKey) {
        nvd {
            apiKey = nvdKey
            delay = 600
        }
    } else {
        nvd {
            delay = 6000
            maxRetryCount = 20
        }
    }
}

