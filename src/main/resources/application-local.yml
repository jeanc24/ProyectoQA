# Perfil `local`: desarrollo sin Keycloak (OAuth2 entra con el perfil docker).
#   ./gradlew bootRun --args="--spring.profiles.active=local"
# Secretos/URL vía env (.env o export); defaults = demo en Postgres host :5433.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:inventory}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:inventory}}
