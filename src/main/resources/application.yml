spring:
  application:
    name: proyecto-qa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      org.hibernate.envers.audit_table_suffix: _audit # Suffix for the audit table
      org.hibernate.envers.revision_sequence_name: revinfo_seq # Sequence for the revision table
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:inventory-api}
    realm: ${KEYCLOAK_REALM:inventory}
    # Admin REST (list users). Defaults = demo local; en prod vienen de env sin default (application-prod.yml).
    admin-server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    admin-username: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  # OBS-01 OpenTelemetry
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING:1.0} # 100% for the demo; lower in prod
  opentelemetry:
    resource-attributes:
      service.name: inventory-api
  # Traces export (OTLP http/protobuf): only active when the endpoint is provided,
  # e.g. MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://alloy:4318/v1/traces
  # Metrics export via OTLP (Prometheus scrape at /actuator/prometheus stays as-is)
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: 30s

# JDBC observation spans (datasource-micrometer): query + fetch, skip connection noise
jdbc:
  includes: query, fetch

logging:
  pattern:
    # traceId/spanId correlation in every log line (used by Loki in OBS-02)
    correlation: "[%X{traceId:-},%X{spanId:-}] "

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
