spring:
  application:
    name: proyecto-qa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      org.hibernate.envers.audit_table_suffix: _audit # Suffix for the audit table
      org.hibernate.envers.revision_sequence_name: revinfo_seq # Sequence for the revision table
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:inventory-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
