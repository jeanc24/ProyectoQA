# Perfil integration: URL/user/password los inyecta Testcontainers (AbstractIntegrationTest).
# Placeholders solo por si alguien arranca con este perfil fuera de IT.
spring:
  datasource:
    username: ${POSTGRES_USER:inventory}
    password: ${POSTGRES_PASSWORD:inventory}

# OBS / OTel: no exportar en tests (sin Alloy)
management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

app:
  keycloak:
    client-id: inventory-api
