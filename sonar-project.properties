# SONAR-01 — SonarCloud (también configurado en build.gradle vía plugin org.sonarqube)
sonar.projectKey=jeanc24_ProyectoQA
sonar.organization=jeanc24
sonar.projectName=ProyectoQA
sonar.host.url=https://sonarcloud.io

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.java.coveragePlugin=jacoco

sonar.exclusions=**/dto/**,**/generated/**,**/*Application.java
sonar.coverage.exclusions=**/dto/**,**/config/**,**/*Application.java
